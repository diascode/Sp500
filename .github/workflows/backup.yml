name: Daily Backup

on:
  schedule:
    - cron: '0 3 * * *'  # 3am UTC daily
  workflow_dispatch:      # allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: backups
          fetch-depth: 0

      - name: Login and download backup
        env:
          ADMIN_EMAIL: ${{ secrets.CRAQUEI_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.CRAQUEI_ADMIN_PASSWORD }}
        run: |
          LOGIN_RESP=$(curl -s -w "\n%{http_code}" https://www.craquei.com.br/api/auth/login \
            -X POST -H "Content-Type: application/json" \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}")

          HTTP_CODE=$(echo "$LOGIN_RESP" | tail -1)
          BODY=$(echo "$LOGIN_RESP" | head -1)

          echo "Login HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Login failed: $BODY"
            exit 1
          fi

          TOKEN=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")

          mkdir -p backups
          BACKUP_FILE="backups/users-$(date +%Y-%m-%d).json"

          BACKUP_CODE=$(curl -s -w "%{http_code}" https://www.craquei.com.br/api/admin/backup \
            -H "Authorization: Bearer $TOKEN" \
            -o "$BACKUP_FILE")

          echo "Backup HTTP status: $BACKUP_CODE"

          if [ "$BACKUP_CODE" != "200" ]; then
            echo "Backup download failed"
            exit 1
          fi

          echo "Backup saved: $BACKUP_FILE ($(wc -c < $BACKUP_FILE) bytes)"

      - name: Remove backups older than 30 days
        run: |
          find backups/ -name "users-*.json" -mtime +30 -delete || true

      - name: Commit backup
        run: |
          git config user.email "backup-bot@craquei.com.br"
          git config user.name "Craquei Backup Bot"
          git add backups/
          git diff --staged --quiet || git commit -m "backup: $(date +%Y-%m-%d) [skip ci]"
          git push origin backups
