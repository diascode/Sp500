<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOMENTUM — Docs</title>
<style>
:root {
  --bg: #0d0906; --bg-card: #140e09; --bg-hover: #1e1510; --bg-code: #0a0703;
  --border: #2a1c12; --accent: #c85a17; --amber: #e8a846; --text: #e8d5c0;
  --dim: #7a6555; --secondary: #9e7f66; --green: #4caf50; --red: #ef5350;
  --blue: #22d3ee; --mono: 'JetBrains Mono','Fira Code',monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; font-size:13px; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
a { color:var(--amber); text-decoration:none; }
a:hover { text-decoration:underline; }

/* Header */
.hdr { background:var(--bg-card); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; align-items:center; gap:12px; flex-shrink:0; }
.logo { font-family:var(--mono); font-size:15px; color:var(--amber); font-weight:700; letter-spacing:1px; }
.logo-sub { font-size:10px; color:var(--dim); font-weight:400; margin-left:6px; }
.hdr-tabs { display:flex; gap:4px; }
.hdr-tab { background:transparent; border:1px solid var(--border); color:var(--secondary); padding:5px 12px; border-radius:4px; cursor:pointer; font-size:11px; font-family:var(--mono); letter-spacing:.5px; }
.hdr-tab:hover { border-color:var(--accent); color:var(--text); }
.hdr-tab.active { background:rgba(200,90,23,.15); border-color:var(--accent); color:var(--amber); }
.search-wrap { flex:1; max-width:280px; }
.search-wrap input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:6px 10px; color:var(--text); font-size:12px; outline:none; }
.search-wrap input:focus { border-color:var(--accent); }
.back-link { font-size:11px; color:var(--dim); margin-left:auto; }
.back-link:hover { color:var(--amber); }

/* Layout */
.app { flex:1; display:flex; overflow:hidden; }
.sidebar { width:230px; background:var(--bg-card); border-right:1px solid var(--border); overflow-y:auto; flex-shrink:0; }
.main { flex:1; overflow-y:auto; padding:24px 32px; }

/* Sidebar */
.sb-section { border-bottom:1px solid var(--border); }
.sb-head { padding:9px 12px; font-family:var(--mono); font-size:9px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none; }
.sb-head:hover { color:var(--amber); }
.sb-head .toggle { font-size:10px; }
.sb-item { padding:5px 14px 5px 22px; font-size:11px; color:var(--secondary); cursor:pointer; display:flex; align-items:center; gap:6px; border-left:2px solid transparent; }
.sb-item:hover { background:var(--bg-hover); color:var(--text); }
.sb-item.active { color:var(--amber); border-left-color:var(--accent); background:rgba(200,90,23,.08); }
.sprint-chip { font-size:8px; padding:1px 5px; border-radius:2px; font-family:var(--mono); margin-left:auto; }
.s1 { background:rgba(76,175,80,.15); color:#4caf50; }
.s2 { background:rgba(232,168,70,.15); color:var(--amber); }
.s3 { background:rgba(34,211,238,.15); color:#22d3ee; }

/* Badges */
.badge { font-size:9px; padding:2px 6px; border-radius:3px; font-family:var(--mono); letter-spacing:.3px; display:inline-flex; align-items:center; gap:3px; }
.b-done { background:rgba(76,175,80,.2); color:#4caf50; }
.b-todo { background:rgba(122,101,85,.2); color:var(--dim); }
.b-progress { background:rgba(232,168,70,.2); color:var(--amber); }

/* Content */
.section-title { font-family:var(--mono); font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:16px; padding-bottom:8px; border-bottom:1px solid var(--border); }
.page-title { font-family:var(--mono); font-size:20px; color:var(--amber); margin-bottom:4px; }
.page-sub { font-size:12px; color:var(--secondary); margin-bottom:24px; }

/* Story card */
.story-card { background:var(--bg-card); border:1px solid var(--border); border-radius:6px; padding:16px; margin-bottom:12px; }
.story-card:hover { border-color:rgba(200,90,23,.4); }
.story-header { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.story-id { font-family:var(--mono); font-size:10px; color:var(--accent); font-weight:700; }
.story-title { font-size:13px; font-weight:600; color:var(--text); flex:1; }
.story-body { font-size:12px; color:var(--secondary); line-height:1.6; }
.story-role { color:var(--blue); }
.story-want { color:var(--text); }
.story-goal { color:var(--dim); }
.ac-list { margin-top:10px; }
.ac-item { font-size:11px; color:var(--secondary); padding:2px 0 2px 12px; border-left:2px solid var(--border); margin:3px 0; line-height:1.5; }
.ac-item strong { color:var(--text); }

/* Epic header */
.epic-header { background:var(--bg-card); border:1px solid var(--border); border-radius:6px; padding:12px 16px; margin-bottom:16px; display:flex; align-items:center; gap:12px; }
.epic-icon { font-size:22px; }
.epic-title { font-family:var(--mono); font-size:14px; color:var(--amber); }
.epic-count { font-size:11px; color:var(--dim); margin-top:2px; }

/* Tech docs */
.doc-section { margin-bottom:32px; }
.doc-h2 { font-family:var(--mono); font-size:14px; color:var(--amber); margin-bottom:12px; padding-bottom:6px; border-bottom:1px solid var(--border); }
.doc-h3 { font-family:var(--mono); font-size:12px; color:var(--accent); margin:16px 0 8px; }
.doc-p { font-size:12px; color:var(--secondary); line-height:1.7; margin-bottom:10px; }
pre { background:var(--bg-code); border:1px solid var(--border); border-radius:4px; padding:12px 14px; font-family:var(--mono); font-size:11px; color:var(--text); overflow-x:auto; margin:10px 0; line-height:1.7; }
code { font-family:var(--mono); font-size:11px; background:var(--bg-code); border:1px solid var(--border); padding:1px 5px; border-radius:3px; color:var(--amber); }
table { width:100%; border-collapse:collapse; font-size:12px; margin:12px 0; }
th { background:var(--bg-hover); padding:8px 10px; text-align:left; font-family:var(--mono); font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; border-bottom:1px solid var(--border); }
td { padding:8px 10px; border-bottom:1px solid var(--border); color:var(--secondary); line-height:1.5; vertical-align:top; }
td:first-child { color:var(--text); font-family:var(--mono); font-size:11px; }
tr:last-child td { border-bottom:none; }
.kv { display:inline; background:rgba(200,90,23,.1); color:var(--accent); font-family:var(--mono); font-size:10px; padding:1px 5px; border-radius:3px; margin:1px; }

/* Sprint filter */
.filter-bar { display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
.filter-btn { background:transparent; border:1px solid var(--border); color:var(--dim); padding:4px 10px; border-radius:4px; cursor:pointer; font-size:11px; font-family:var(--mono); }
.filter-btn:hover { border-color:var(--amber); color:var(--amber); }
.filter-btn.active { background:rgba(232,168,70,.15); border-color:var(--amber); color:var(--amber); }
.filter-label { font-size:11px; color:var(--dim); }

/* Stats row */
.stats-row { display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; }
.stat-box { background:var(--bg-card); border:1px solid var(--border); border-radius:6px; padding:10px 16px; text-align:center; flex:1; min-width:100px; }
.stat-num { font-family:var(--mono); font-size:20px; color:var(--amber); }
.stat-lbl { font-size:10px; color:var(--dim); margin-top:2px; text-transform:uppercase; letter-spacing:.5px; }

.hidden { display:none !important; }
</style>
</head>

  {
    id:'arch', title:'Architecture Overview',
    content:`<div class="doc-h2">Architecture Overview</div>
<div class="doc-p">MOMENTUM is a <strong>monolithic, server-rendered single-page application</strong> deliberately built with minimal dependencies to keep operational complexity near zero.</div>
<pre>Browser (stock-dashboard.html — Vanilla JS SPA ~3,900 lines)
  ↕ HTTP (port 8081 → 8080)
Docker Container (server.js — Node.js, no framework)
  ↕ HTTPS
  ├── Yahoo Finance (unofficial proxy — US, Europe, Emerging)
  ├── brapi.dev (Sprint 3 — B3 / Brasil tickers)
  └── Stripe API (payments)</pre>
<table>
<tr><th>Decision</th><th>Rationale</th></tr>
<tr><td>No framework (raw Node.js http)</td><td>Zero dependency surface; trivial Docker image</td></tr>
<tr><td>Single HTML file frontend</td><td>No build step; deploy by copying one file</td></tr>
<tr><td>localStorage for portfolio</td><td>No server storage cost; data owned by user</td></tr>
<tr><td>JSON file for users</td><td>Zero-ops until ~5k users; atomic writes prevent corruption</td></tr>
<tr><td>Server-side Yahoo proxy</td><td>Avoids CORS; allows caching; hides user IPs from third party</td></tr>
</table>`

    content:`<div class="doc-h2">Technical Analysis Engine</div>
<div class="doc-p">All indicator computation runs <strong>client-side</strong> in the browser from raw OHLCV arrays returned by the server. No server-side computation required for signals.</div>
<table>
<tr><th>Indicator</th><th>Period</th><th>Signal Scoring</th></tr>
<tr><td>RSI</td><td>14</td><td>45–65 = +1pt; &lt;35 = +0.5pt (oversold); &gt;70 or &lt;25 = −0.5pt</td></tr>

<tr><td>ADX</td><td>14</td><td>ADX &gt; 25 = +0.5pt (confirms trend strength)</td></tr>
<tr><td>SMA alignment</td><td>9, 20, 50, 200</td><td>Price above SMA50 = +1pt; 3+ above = strong bull</td></tr>
<tr><td>Bollinger Bands</td><td>20, 2σ</td><td>Squeeze/breakout detection — secondary confirmation only</td></tr>
<tr><td>ATR</td><td>14</td><td>Used for TP/SL band sizing: TP = price + ATR×2, SL = price − ATR×1.5</td></tr>
</table>
<div class="doc-h3">Composite Signal Thresholds</div>
<pre>Score ≥ 2.5  →  BUY
Score ≤ -1.0 →  SELL
Otherwise    →  HOLD</pre>
<div class="doc-h3">Pattern Finder (20 patterns)</div>
<div class="doc-p">Each pattern scored 0–9 points: 0–4 from direction alignment (RSI, MACD, ADX, SMA), 0–5 from candle shape heuristics (last 30–90 candles). Results sorted by score descending, filterable by direction and pattern name.</div>`
  },
  {
    id:'docker', title:'Docker & Deployment',
    content:`<div class="doc-h2">Docker & Deployment</div>
<pre># Build and start
docker compose up -d --build

# View logs
docker compose logs -f

# Stop
docker compose down</pre>
<div class="doc-h3">Port Mapping</div>
<div class="doc-p">Host port <strong>8081</strong> → Container port <strong>8080</strong><br>App accessible at <a href="http://localhost:8081">http://localhost:8081</a></div>
<div class="doc-h3">Data Persistence</div>
<div class="doc-p"><code>./data:/app/data</code> volume mount ensures <code>users.json</code> persists across container rebuilds.<br>Stock-dashboard.html and other static files are baked into the image — frontend changes require a rebuild.</div>
<div class="doc-h3">Making Frontend Changes</div>
<div class="doc-p">1. Edit <code>stock-dashboard.html</code><br>2. The server serves it with <code>Cache-Control: no-cache</code> — hard refresh picks up changes in dev mode.<br>3. For production (Docker): <code>docker compose up -d --build</code></div>
<div class="doc-h3">Healthcheck</div>
<pre>test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/',r=>{...})"]
interval: 30s  timeout: 5s  retries: 3</pre>`
  },
];

// ─── STATE ──────────────────────────────────────────────────────────────────
let currentView = 'stories';
let currentSection = null;
let sprintFilter = 0;
let searchQuery = '';

// ─── RENDER ──────────────────────────────────────────────────────────────────
function setView(v) {
  currentView = v;
  document.querySelectorAll('.hdr-tab').forEach(b => b.classList.remove('active'));
  document.querySelector(`.hdr-tab[onclick="setView('${v}')"]`).classList.add('active');
  currentSection = null;
  renderSidebar();
  renderMain();
}

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  if (currentView === 'stories') {
    let html = '';
    // Sprint filter
    html += '<div class="sb-section"><div class="sb-head" style="cursor:default">Sprint Filter</div>';
    [{v:0,l:'All Sprints'},{v:1,l:'Sprint 1'},{v:2,l:'Sprint 2'},{v:3,l:'Sprint 3'}].forEach(f => {
      const active = sprintFilter === f.v ? 'active' : '';
      html += `<div class="sb-item ${active}" onclick="setSprint(${f.v})">${f.l}</div>`;
    });
    html += '</div>';
    EPICS.forEach(e => {
      if (sprintFilter && e.sprint !== sprintFilter) return;
      const active = currentSection === e.id ? 'active' : '';
      const cls = e.sprint === 1 ? 's1' : e.sprint === 2 ? 's2' : 's3';
      html += `<div class="sb-section">
        <div class="sb-item ${active}" onclick="showEpic('${e.id}')">
          <span>${e.icon} ${e.title}</span>
          <span class="sprint-chip ${cls}">S${e.sprint}</span>
        </div>
      </div>`;
    });
    sb.innerHTML = html;
  } else {
    let html = '';
    DOC_SECTIONS.forEach(s => {
      const active = currentSection === s.id ? 'active' : '';
      html += `<div class="sb-section"><div class="sb-item ${active}" onclick="showDocSection('${s.id}')">${s.title}</div></div>`;
    });
    sb.innerHTML = html;
  }
}

function renderMain() {
  const main = document.getElementById('main');
  if (currentView === 'stories') {
    if (!currentSection) {
      renderStoriesOverview(main);
    } else {
      const epic = EPICS.find(e => e.id === currentSection);
      if (epic) renderEpic(main, epic);
    }
  } else {
    if (!currentSection) {
      renderDocsOverview(main);
    } else {
      const sec = DOC_SECTIONS.find(s => s.id === currentSection);
      if (sec) main.innerHTML = `<div class="doc-section">${sec.content}</div>`;
    }
  }
}

function renderStoriesOverview(main) {
  const allStories = Object.values(STORIES);
  const done = allStories.filter(s => s.status === 'done').length;
  const planned = allStories.filter(s => s.status === 'planned').length;
  const filteredEpics = sprintFilter ? EPICS.filter(e => e.sprint === sprintFilter) : EPICS;

  let html = `<div class="page-title">User Stories</div>
<div class="page-sub">Product requirements organized by epic — 75 stories across 21 epics</div>
<div class="stats-row">
  <div class="stat-box"><div class="stat-num">${allStories.length}</div><div class="stat-lbl">Total Stories</div></div>
  <div class="stat-box"><div class="stat-num" style="color:var(--green)">${done}</div><div class="stat-lbl">Done</div></div>
  <div class="stat-box"><div class="stat-num" style="color:var(--dim)">${planned}</div><div class="stat-lbl">Planned</div></div>
  <div class="stat-box"><div class="stat-num">3</div><div class="stat-lbl">Sprints</div></div>
</div>
<div class="filter-bar">
  <span class="filter-label">Sprint:</span>
  ${[{v:0,l:'All'},{v:1,l:'Sprint 1'},{v:2,l:'Sprint 2'},{v:3,l:'Sprint 3'}].map(f =>
    `<button class="filter-btn ${sprintFilter===f.v?'active':''}" onclick="setSprint(${f.v})">${f.l}</button>`
  ).join('')}
</div>`;

  filteredEpics.forEach(e => {
    const cls = e.sprint === 1 ? 's1' : e.sprint === 2 ? 's2' : 's3';
    const epicDone = e.stories.filter(id => STORIES[id]?.status === 'done').length;
    html += `<div class="epic-header" onclick="showEpic('${e.id}')" style="cursor:pointer">
      <span class="epic-icon">${e.icon}</span>
      <div>
        <div class="epic-title">Epic ${e.num} — ${e.title}</div>
        <div class="epic-count">${epicDone}/${e.stories.length} stories done</div>
      </div>
      <span class="sprint-chip ${cls}" style="margin-left:auto">Sprint ${e.sprint}</span>
    </div>`;
  });

  main.innerHTML = html;
}

function renderEpic(main, epic) {
  const cls = epic.sprint === 1 ? 's1' : epic.sprint === 2 ? 's2' : 's3';
  let html = `<div class="epic-header">
    <span class="epic-icon">${epic.icon}</span>
    <div>
      <div class="epic-title">Epic ${epic.num} — ${epic.title}</div>
      <div class="epic-count">${epic.stories.length} user stories · <span class="sprint-chip ${cls}">Sprint ${epic.sprint}</span></div>
    </div>
  </div>`;

  epic.stories.forEach(id => {
    const s = STORIES[id];
    if (!s) return;
    if (searchQuery && !matchesSearch(s, id)) return;
    const bClass = s.status === 'done' ? 'b-done' : s.status === 'progress' ? 'b-progress' : 'b-todo';
    const bLabel = s.status === 'done' ? '✓ Done' : s.status === 'progress' ? '⟳ In Progress' : '○ Planned';
    html += `<div class="story-card">
      <div class="story-header">
        <span class="story-id">US-${id}</span>
        <span class="story-title">${s.title}</span>
        <span class="badge ${bClass}">${bLabel}</span>
      </div>
      <div class="story-body">
        <span class="story-role">As a ${s.role}</span>,
        <span class="story-want"> I want to ${s.want}</span>,
        <span class="story-goal"> so that ${s.goal}.</span>
      </div>
      ${s.ac && s.ac.length ? `<div class="ac-list">${s.ac.map(a => `<div class="ac-item">→ ${a}</div>`).join('')}</div>` : ''}
    </div>`;
  });

  main.innerHTML = html;
}

function renderDocsOverview(main) {
  let html = `<div class="page-title">Technical Documentation</div>
<div class="page-sub">Architecture, APIs, data model, and deployment — MOMENTUM v5.2</div>
<div class="stats-row">
  <div class="stat-box"><div class="stat-num">1</div><div class="stat-lbl">HTML file (SPA)</div></div>
  <div class="stat-box"><div class="stat-num">~3,900</div><div class="stat-lbl">Frontend lines</div></div>
  <div class="stat-box"><div class="stat-num">~900</div><div class="stat-lbl">Server lines</div></div>
  <div class="stat-box"><div class="stat-num">160</div><div class="stat-lbl">Stocks across 4 markets</div></div>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:8px">`;
  DOC_SECTIONS.forEach(s => {
    html += `<div class="story-card" onclick="showDocSection('${s.id}')" style="cursor:pointer">
      <div class="story-title" style="margin-bottom:6px">${s.title}</div>
    </div>`;
  });
  html += '</div>';
  main.innerHTML = html;
}

function showEpic(id) {
  currentSection = id;
  renderSidebar();
  renderMain();
  document.getElementById('main').scrollTop = 0;
}

function showDocSection(id) {
  currentSection = id;
  renderSidebar();
  renderMain();
  document.getElementById('main').scrollTop = 0;
}

function setSprint(v) {
  sprintFilter = v;
  currentSection = null;
  renderSidebar();
  renderMain();
}

function matchesSearch(story, id) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  return (
    ('us-' + id).includes(q) ||
    story.title.toLowerCase().includes(q) ||
    story.role.toLowerCase().includes(q) ||
    story.want.toLowerCase().includes(q) ||
    (story.ac || []).some(a => a.toLowerCase().includes(q))
  );
}

function applySearch(q) {
  searchQuery = q.trim().toLowerCase();
  if (currentView === 'stories' && currentSection) {
    renderMain();
  } else if (currentView === 'stories') {
    renderMain();
  }
}

// ─── INIT ────────────────────────────────────────────────────────────────────
renderSidebar();
renderMain();
</script>
</body>
</html>
