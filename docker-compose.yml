services:
  stock-dashboard:
    build: .
    container_name: jerry-stock-dashboard
    ports:
      - "8081:8080"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - JWT_SECRET=dev-local-secret-change-in-prod
      - APP_URL=http://localhost:8080
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
